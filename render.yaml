services:
  - type: web
    name: ai-ad-creator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # SQLite on the backend's own local disk — simplest option for a
      # single-owner tool. Unlike some other personal projects in this
      # account, this one DOES have real user data worth keeping (your ad
      # generation history, and the rendered video files under
      # VIDEO_STORAGE_DIR) — Render's free plan has no persistent disk, so
      # both are wiped on every redeploy/restart. Add a paid disk (or switch
      # DATABASE_URL to Postgres and VIDEO_STORAGE_DIR to some other
      # persistent store) if you want them to survive deploys. Download any
      # video you care about right after generating it.
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Required for ad generation — get one at console.anthropic.com. Every
      # "Create ads" click makes one paid API call; there's no free tier for
      # this feature.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required only for the UGC Ad tab — two separate paid accounts, get
      # them at elevenlabs.io and studio.d-id.com. Leave both unset to skip
      # UGC ads entirely; the tab tells you clearly if they're missing.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: D_ID_API_KEY
        sync: false
      # Render's proxy defaults to port 10000 unless told otherwise — this
      # must match the port the Dockerfile's CMD actually listens on.
      - key: PORT
        value: "8000"
      # Can't be known until the frontend exists — deploy once, then fill in
      # from the Render dashboard and redeploy.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-ad-creator-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Must be set BEFORE the first real deploy if possible — next.config.js's
      # rewrite is resolved at build time, so changing this later means
      # redeploying (a full rebuild), not just restarting.
      - key: BACKEND_URL
        sync: false
      # Deliberately no PORT override here — Next.js's standalone server
      # already reads Render's auto-injected PORT on its own.
